<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twixor — Premium AI Engagement & Content Workspace</title>
  <meta name="description" content="Twixor is a unified, luxury SaaS AI-powered engagement platform across Desktop, Chrome Extension, and Mobile Web.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon.png">
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <!-- Dynamic Application Root (Full Screen SaaS Workspace) -->
  <main id="mainContentArea" class="app-root">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Inter',sans-serif; background:#0A0C10; color:#fff;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
        <img src="assets/icon.png" width="42" height="42" style="border-radius:10px; object-fit:contain; box-shadow: 0 4px 16px rgba(0,0,0,0.3);" alt="Twixor Logo">
        <span style="font-size:22px; font-weight:800; letter-spacing:-0.5px;">Twixor</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:#9DA3AF;">
        <div style="width:16px; height:16px; border:2px solid #3B66FF; border-top-color:transparent; border-radius:50%; animation:atomxSpin 0.8s linear infinite;"></div>
        <span>Initializing Workspace...</span>
      </div>
      <style>@keyframes atomxSpin { to { transform: rotate(360deg); } }</style>
    </div>
  </main>

  <script src="app.js?v=2.0"></script>
</body>
</html>
