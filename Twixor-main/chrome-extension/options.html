<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twixor — Extension Options</title>
  <style>
    :root {
      --bg-canvas: #F7F8FA;
      --bg-card: #FFFFFF;
      --text-primary: #111318;
      --text-secondary: #6B7280;
      --border-subtle: #E7E9ED;
      --blue-primary: #3157E6;
      --radius-sm: 8px;
      --radius-md: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      padding: 32px;
      display: flex;
      justify-content: center;
    }
    .options-container {
      max-width: 520px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--blue-primary);
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--blue-primary);
      color: #fff;
      border: none;
    }
    .btn-secondary {
      background: #fff;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }
    .notice {
      margin-top: 20px;
      padding: 12px;
      background: #EAF0FF;
      border: 1px solid #D3E0FD;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: #2646BF;
      line-height: 1.4;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="options-container">
    <div class="header">
      <img src="icons/icon32.png" width="28" height="28" style="border-radius:6px; object-fit:contain;" alt="Twixor">
      <div class="brand-title">Twixor — Extension Settings</div>
    </div>

    <div class="form-group">
      <label>Backend API Endpoint</label>
      <input type="url" id="backendUrlInput" placeholder="https://twixor.onrender.com">
    </div>

    <div class="form-group">
      <label>Default Reply Style</label>
      <select id="defaultStyleSelect">
        <option value="Natural & Concise">Natural & Concise</option>
        <option value="Professional">Professional</option>
        <option value="Engaging Question">Engaging Question</option>
        <option value="Friendly">Friendly</option>
        <option value="Witty">Witty</option>
      </select>
    </div>

    <div class="notice">
      🔒 <strong>Security Architecture:</strong> OpenAI secret keys and credit balances are stored and validated exclusively on the Twixor backend server. No secret keys exist within this extension bundle.
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="saveBtn">Save Settings</button>
      <button class="btn btn-secondary" id="testBtn">Test Connection</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
